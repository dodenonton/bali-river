<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Jungle Forest -->
    <linearGradient id="jungleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071913" />
      <stop offset="60%" stop-color="#0B241C" />
      <stop offset="100%" stop-color="#13382B" />
    </linearGradient>

    <!-- Mountain Gradient: Sacred Balinese Gold -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3C359" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#C87D4B" />
    </linearGradient>

    <!-- River Wave Glow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Shield Container -->
  <rect width="500" height="500" rx="110" fill="url(#jungleGradient)" />
  <rect x="15" y="15" width="470" height="470" rx="95" fill="none" stroke="#D4AF37" stroke-width="4" stroke-opacity="0.4" />

  <!-- Sacred Mountain Peak (Gunung Batur / Mount Agung / Candi Meru) -->
  <g filter="url(#softShadow)">
    <polygon points="250,90 380,290 120,290" fill="url(#goldGradient)" />
    <!-- Inner Sunlight Shadow facet -->
    <polygon points="250,90 380,290 250,290" fill="#B36A3B" opacity="0.45" />
    <!-- Sacred Sun / Source Circle -->
    <circle cx="250" cy="180" r="28" fill="#FBF9F5" opacity="0.9" />
  </g>

  <!-- River Rapids & Canyon Waters (Ayung River & Secret Canyon) -->
  <g filter="url(#softShadow)">
    <!-- Primary Terracotta Rapid Wave -->
    <path d="M90 340 C 150 290, 210 390, 270 340 C 330 290, 390 370, 420 340" 
          fill="none" 
          stroke="#C87D4B" 
          stroke-width="26" 
          stroke-linecap="round" />

    <!-- Pure Spring River Foam Wave -->
    <path d="M110 395 C 170 355, 230 435, 290 395 C 345 355, 385 410, 410 395" 
          fill="none" 
          stroke="#FBF9F5" 
          stroke-width="18" 
          stroke-linecap="round" 
          opacity="0.95" />
  </g>

  <!-- Subtle Ubud Bamboo Leaf Accent -->
  <path d="M250 42 C 242 65, 248 80, 250 88 C 252 80, 258 65, 250 42 Z" fill="#D4AF37" opacity="0.8" />
</svg>
